<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvilEngine UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>EVILGPT TERMINAL</h1>
        <div id="chat-box" aria-live="polite"></div>
        <div class="input-area">
            <input type="text" id="prompt-input" placeholder="Type your command..." onkeydown="if(event.key==='Enter') sendPrompt()">
            <button onclick="sendPrompt()">EXECUTE</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
